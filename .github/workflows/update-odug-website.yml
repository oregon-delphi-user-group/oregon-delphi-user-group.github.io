name: Update ODUG Website
on: [push]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions: 
  contents: read
  pages: write
  id-token: write
  
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false
  
# Default to bash
defaults:
  run:
    shell: bash

jobs:
  rebuild-website:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh website files from repository
        id: checkout
        env:
          TZ: 'America/Los_Angeles'
        uses: actions/checkout@v4
          
      - name: Get theme submodule
        env:
          TZ: 'America/Los_Angeles'
        uses: actions/checkout@v4
        with:
          repository: corneliusdavid/hugo-pascalinia
          path: themes/pascalinia

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build website with Hugo
        id: build
        env:
          TZ: 'America/Los_Angeles'
        uses: jakejarvis/hugo-build-action@master
        with:
          args: --minify --buildFuture  
          
      - name: Upload static files as an artifact
        id: updload-pages
        env:
          TZ: 'America/Los_Angeles'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: rebuild-website
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
